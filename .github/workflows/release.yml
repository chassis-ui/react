name: Release

# Standard changesets/action recipe: on every push to main, either opens/updates a "Version
# Packages" PR (when .changeset/*.md files are pending) or publishes to npm (when that PR was
# just merged, i.e. no pending changesets remain and packages/react/package.json's version isn't
# on npm yet). See packages/react/VERSIONING.md for the full release process this wires up.
on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write # changesets/action creates the Version Packages PR and, on publish, a git tag
  pull-requests: write # ...and needs this to open/update that PR
  id-token: write # npm trusted publishing and provenance (OIDC) — no npm token is needed

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # changesets needs full history to diff against the last release

      - uses: pnpm/action-setup@v6

      # Node 24 by name, not .nvmrc: it ships npm 11, which trusted publishing needs (11.5.1 or
      # later). `changeset publish` runs `pnpm publish`, which hands the upload to that npm.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile

      # dist/ is gitignored — has to be rebuilt here before `changeset publish` can ship it.
      # (When this step runs for the "open/update the Version Packages PR" case instead of an
      # actual publish, the build output is simply unused — cheap enough not to special-case.)
      - run: pnpm react:build

      - name: Create Version Packages PR or publish to npm
        uses: changesets/action@v2
        with:
          version-script: pnpm changeset:version
          publish-script: pnpm changeset:publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # npm trusted publishing: @chassis-ui/react trusts this workflow file (release.yml) of
          # chassis-ui/react, so npm authenticates the publish by OIDC. Renaming this file breaks
          # publishing until the trusted publisher on npmjs.com is updated to match.
          NPM_CONFIG_PROVENANCE: true
