version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: develop
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    # Dependabot waits 3 days after a release by default, and passes that on to pnpm as its
    # minimum release age when it re-resolves the lockfile, so a Chassis package that develop
    # already requires failed the whole run until it was 3 days old. Chassis releases can be
    # urgent fixes between our own packages: they are exempt here, and from pnpm's check in
    # pnpm-workspace.yaml. Everything else keeps the default.
    cooldown:
      default-days: 3
      exclude:
        - "@chassis-ui/*"
    groups:
      # A release of a Chassis package opens one pull request of its own, apart from the routine
      # updates: a 0.x minor of these is breaking, and it can change the compiled CSS.
      # packages/react/package.json pins @chassis-ui/css as a peer to one minor
      # (`>=0.5.0 <0.6.0`). The pull request that takes a new css minor must widen that range and
      # add a changeset for it.
      chassis-ui:
        patterns:
          - "@chassis-ui/*"
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
        exclude-patterns:
          - "@chassis-ui/*"
    ignore:
      # Major bumps for these are deliberate, coordinated changes (peer deps, build tooling
      # tied to CI's pinned versions) rather than routine updates — see AGENTS.md.
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@playwright/test"
        update-types: ["version-update:semver-major"]
      - dependency-name: "playwright"
        update-types: ["version-update:semver-major"]
      # vitest majors are gated on Storybook, not on vitest itself: `@storybook/addon-vitest`
      # (which wires the stories into vitest's browser project — see packages/react/AGENTS.md)
      # peer-requires `vitest: ^3.0.0 || ^4.0.0` as of its current stable 10.6.0, and
      # `@vitest/browser-playwright: ^4.0.0`. The first release accepting vitest 5 is
      # `@storybook/addon-vitest@11.0.0-alpha.1`, i.e. a Storybook 11 prerelease. So a vitest
      # major is a coordinated Storybook upgrade, not a routine bump, and the three packages
      # have to move together anyway (`@vitest/coverage-istanbul` and
      # `@vitest/browser-playwright` both peer-require the *exact* matching vitest version).
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/coverage-istanbul"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/browser-playwright"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: develop
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
