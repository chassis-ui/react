packages:
  - 'packages/*'
  - 'smoke-tests/*'

# Our own packages install at any age. Dependabot hands its 3-day cooldown to pnpm as a minimum
# release age when it re-resolves the lockfile, which rejected a Chassis release that develop
# already required. A Chassis release can be an urgent fix between our packages. See the cooldown
# in .github/dependabot.yml, which exempts the same packages.
minimumReleaseAgeExclude:
  - '@chassis-ui/*'

# simple-git-hooks installs the pre-commit hook from the root `prepare` script instead.
ignoredBuiltDependencies:
  - simple-git-hooks
onlyBuiltDependencies:
  - '@parcel/watcher'
  - esbuild
  - sharp
overrides:
  '@babel/core': ^7.29.6
  'brace-expansion@<1.1.21': ^1.1.21
  immutable: '>=5.1.8'
  nanoid: '>=3.3.18'
  postcss: '>=8.5.23'
  sharp: '>=0.35.0'
  svgo: '>=4.0.2'
