blank_issues_enabled: false
contact_links:
  - name: Question or idea
    url: https://github.com/chassis-ui/react/discussions
    about: Ask a question or talk an idea through before it becomes an issue.
  - name: Chassis CSS (the styling layer)
    url: https://github.com/chassis-ui/css
    about: A problem with how a class looks, with the same markup in plain HTML, belongs in the CSS framework.
  - name: Security vulnerability
    url: https://github.com/chassis-ui/react/security/advisories/new
    about: Report it privately, not as a public issue.
