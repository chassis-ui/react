name: Documentation
description: Something on chassis-ui.com/react/, in a README or in CONTRIBUTING.md is wrong, missing or unclear
labels: [documentation, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        For the docs of Chassis CSS, Tokens, Icons, Assets or Figma, open the issue in [that project's repository](https://github.com/chassis-ui).
  - type: input
    id: location
    attributes:
      label: Where
      description: The page URL or the file.
      placeholder: https://chassis-ui.com/react/docs/components/popover/
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong or missing
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: What it should say
      description: Optional. A suggested wording helps.
